[project]
name = "nba-injury-feature-timing-audit"
version = "0.1.0"
description = "Feature-timing audit and analysis pipeline for an NBA injury-forecasting cohort"
requires-python = "==3.14.*"

# Pinned exactly, on purpose. The numbers in NBA_Injury_Forecasting_Study_FINAL.md
# were produced by these versions; a floating range would let a future `uv sync`
# silently change a reported statistic.
dependencies = [
    "pandas==3.0.2",
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "xgboost==3.3.0",
    "pyarrow==25.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Analysis scripts live in topic folders, not an installable package.
bypass-selection = true
